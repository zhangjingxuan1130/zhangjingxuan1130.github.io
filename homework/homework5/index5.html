<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网上书城</title>
    <style>
        body{
            background: #eee;
        }

        .box{
            width: 600px;
            margin: 30px auto;
        }

        .title{
            background-color: #666;
            color: white;
            text-align: center;
            padding: 25px;
            font-size: 1.8em;
            font-family: '隶书';
            letter-spacing: 20px;
        }

        .next{
            margin: 6px auto;
            border: 6px solid white;
            background: #eee;
        }

        .next-title{
            font-size: 1.1em;
            border: 3px solid #eee;
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-indent: 2em;
            background-image: linear-gradient(180deg, white,#666);
        }

        table{
            margin: 0 auto;
        }

        td{
            padding: 6px 4px;
        }

        input{
            width: 280px;
        }

        .submit-btn{
            width: 100%;
            background: #666;
            color: white;
            border: none;
            padding: 6px;
            margin-top: 10px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="title">网上书城</div>
        <div class="next">
            <div class="next-title">✚ 注册新用户</div>
            <form action="" method="post">
                <table>
                    <tr>
                        <td>
                            <input type="text" name="username" placeholder="👤用户名">
                        </td>
                        
                    </tr>
                    <tr>
                        <td>
                            <input type="password" name="pwd" placeholder="🔑密码">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="password" name="repwd" placeholder="🔑确认密码">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="email" name="email" placeholder="📧电子邮件">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="submit" value="注册新用户" class="submit-btn">
                        </td>
                    </tr>
                        
                </table>
            </form>
        </div>


    </div>
</body>
</html>
